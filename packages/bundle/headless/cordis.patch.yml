# The dsh-headless bundle patch: one-shot task mode, or a credential login,
# directly over dsh-base. It mounts no Host, HTTP server, Web runtime, or
# browser plugin. An ordinary provider plugin injects `cmdlineArgs`, parses
# either the task positional (`dsh --profile headless "<task>"`) or the
# `login <key>` subcommand, and this app's --help; the direct driver then
# either creates an Agent through the core registry and prints its durable
# result, or authorizes the named credential through `ctx.authorization` over
# a terminal interaction.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: tools
  config:
    # Keep the same temporary process-wide PTC mode opt-in as the Web surface.
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    # PTC mode is a core execution capability, not a Web component.
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: headless-startup
      name: '@deepseek-ai/dsh-headless/startup'

    # Reads its resolved task or login request from the ordinary
    # headlessStartup provider; only the field its own mode uses is set.
    - id: headless-runner
      name: '@deepseek-ai/dsh-headless'
      inject: [headlessStartup]
      config:
        mode: !!js ctx.headlessStartup.mode
        task: !!js "ctx.headlessStartup.mode === 'task' ? ctx.headlessStartup.task : undefined"
        key: !!js "ctx.headlessStartup.mode === 'login' ? ctx.headlessStartup.key : undefined"
        method: !!js "ctx.headlessStartup.mode === 'login' ? ctx.headlessStartup.method : undefined"
